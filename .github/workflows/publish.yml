name: Publish SDK

on:
  push:
    tags:
      - "v*" # 正式版发布: v1.0.0, v1.1.0, etc.
    branches:
      - publish # Snapshot 发布

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest # 需要 macOS 来构建 iOS/tvOS 目标

    # 设置权限
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('**/Podfile.lock', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Verify GPG key setup
        run: |
          echo "GPG key is configured via environment variables for in-memory signing"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install CocoaPods dependencies
        run: |
          # Ensure CocoaPods is installed
          gem install cocoapods --no-document
          # Sync all CocoaPods for Kotlin Multiplatform (downloads and generates Kotlin bindings)
          ./gradlew podInstall --stacktrace --no-daemon

      - name: Determine version type
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "Publishing release version (from tag: ${{ github.ref_name }})"
          else
            echo "type=snapshot" >> $GITHUB_OUTPUT
            echo "tag=snapshot" >> $GITHUB_OUTPUT
            echo "Publishing snapshot version (from branch: ${{ github.ref_name }})"
          fi

      - name: Run JVM/Android tests
        run: |
          # 只运行 JVM/Android 测试
          # iOS 测试由 fc-sdk-ios 项目负责
          ./gradlew jvmUnitTestAll --stacktrace --no-daemon

      - name: Stop Gradle Daemon
        run: ./gradlew --stop

      - name: Publish to Maven Central
        env:
          # Maven Central Portal credentials (Vanniktech plugin uses these env var names)
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing credentials (supports both base64 and ASCII armored)
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 检查 secrets 是否配置
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "## Publish Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Maven Central secrets not configured. Skipping publish step." >> $GITHUB_STEP_SUMMARY
            echo "To enable publishing, configure the following secrets:" >> $GITHUB_STEP_SUMMARY
            echo "- MAVEN_CENTRAL_USERNAME" >> $GITHUB_STEP_SUMMARY
            echo "- MAVEN_CENTRAL_PASSWORD" >> $GITHUB_STEP_SUMMARY
            echo "- GPG_PRIVATE_KEY" >> $GITHUB_STEP_SUMMARY
            echo "- GPG_PASSPHRASE" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "Publishing version: $VERSION"

          # Determine if this is a snapshot or release build
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "📦 Publishing release version (from tag: ${{ github.ref_name }})"
          else
            echo "📦 Publishing snapshot version (from branch: ${{ github.ref_name }})"
          fi

          # Publish all modules using Vanniktech plugin
          # This will upload to Maven Central Portal
          ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

          echo "✅ Publishing completed"

      # 创建 GitHub Release（仅正式版）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        if: success()
        run: |
          echo "## Publish Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Released ${{ github.ref_name }} to Maven Central" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
            echo "- Manually publish in Maven Central Portal: https://central.sonatype.com/publishing/deployments" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Published artifacts:**" >> $GITHUB_STEP_SUMMARY
            echo "- cloud.flashcat:fc-sdk-kotlin-multiplatform-core" >> $GITHUB_STEP_SUMMARY
            echo "- cloud.flashcat:fc-sdk-kotlin-multiplatform-rum" >> $GITHUB_STEP_SUMMARY
            echo "- cloud.flashcat:fc-sdk-kotlin-multiplatform-webview" >> $GITHUB_STEP_SUMMARY
            echo "- cloud.flashcat:fc-sdk-kotlin-multiplatform-ktor" >> $GITHUB_STEP_SUMMARY
            echo "- cloud.flashcat:fc-sdk-kotlin-multiplatform-ktor3" >> $GITHUB_STEP_SUMMARY
          else
            echo "Published snapshot from ${{ github.ref_name }} branch" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Snapshot repository: https://central.sonatype.com/repository/maven-snapshots/" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify DingTalk on success
        if: success()
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-kotlin-multiplatform 发布通知",
                "text": "### ✅ fc-sdk-kotlin-multiplatform 发布成功\n\n---\n\n 🔖 版本: ${{ github.ref_name }}\n\n 📦 包名: fc-sdk-kotlin-multiplatform-core, rum, webview, ktor\n\n ☕ 平台: Maven Central\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify on failure
        if: failure()
        run: |
          echo "## Publishing Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs for details. Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- GPG key not properly configured (must be base64 encoded)" >> $GITHUB_STEP_SUMMARY
          echo "- Maven Central credentials incorrect" >> $GITHUB_STEP_SUMMARY
          echo "- Version already exists (for release builds)" >> $GITHUB_STEP_SUMMARY
          echo "- iOS/tvOS build failed (check Xcode version)" >> $GITHUB_STEP_SUMMARY

      - name: Notify DingTalk on failure
        if: failure()
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-kotlin-multiplatform 发布通知",
                "text": "### ❌ fc-sdk-kotlin-multiplatform 发布失败\n\n---\n\n 🔖 版本: ${{ github.ref_name }}\n\n 📦 包名: fc-sdk-kotlin-multiplatform-core, rum, webview, ktor\n\n ☕ 平台: Maven Central\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
